/* Layout: app shell with a module sidebar (collapses to a top tab strip on phones); each module is one focused page.
   Deliberately single-theme: the Bella&Bona green world, colors set explicitly. */
:root{
  color-scheme:light;
  --bg:#F9FFE9; --surface:#FFFFFF; --green:#024930; --ink:#001F00; --lime:#E6FFA9;
  --muted:rgba(0,31,0,.6); --faint:rgba(0,31,0,.4); --line:rgba(2,73,48,.13); --tint:rgba(2,73,48,.06);
  --go:#1E7A3C; --warn:#B36A00; --stop:#9A0103;
  --display:"Roc Grotesk Cond","Arial Narrow","Roboto Condensed",sans-serif;
  --body:"Figtree",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--green);color:var(--bg);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.side img{width:190px;max-width:calc(100% - 20px);height:auto;margin:4px 10px 8px;display:block}
.side .app{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);opacity:.8;margin:0 10px 22px}
.side .grp{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.55;margin:18px 10px 6px;padding-top:14px;border-top:1px solid rgba(249,255,233,.15)}
.side img+.grp{border-top:0;padding-top:0;margin-top:18px}
.nav{border:0;background:none;color:var(--bg);text-align:left;padding:9px 10px;border-radius:10px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14.5px;width:100%}
.nav .num{width:22px;height:22px;border-radius:7px;border:1.5px solid rgba(249,255,233,.35);display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:0 0 auto}
.nav[aria-current="page"]{background:var(--lime);color:var(--green)}
.nav[aria-current="page"] .num{border-color:var(--green)}
.nav.soon{opacity:.5}
.nav .soonlbl{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.side .me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-top:1px solid rgba(249,255,233,.15);font-size:13px}
.side .av{width:30px;height:30px;border-radius:50%;background:var(--lime);color:var(--green);display:grid;place-items:center;font-weight:800;font-size:12px}
.main{min-width:0;padding-block:28px 120px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:48px;line-height:.95;margin:6px 0 8px;color:var(--green);text-wrap:balance}
.lead{color:var(--muted);max-width:62ch;margin:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:14.5px;background:var(--green);color:var(--lime);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;white-space:nowrap}
.btn.light{background:var(--surface);color:var(--green);border:1.5px solid var(--line)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{border:0;background:none;color:var(--green);font-weight:700;padding:0;text-decoration:underline;text-underline-offset:3px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.sec{margin-bottom:22px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 10px}
.sech h2{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--green);margin:0}
.sech span{font-size:13px;color:var(--muted)}
/* gates */
.gates{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.gate{padding:14px 16px;border-right:1px solid var(--line)}
.gate:last-child{border-right:0}
.gate b{display:block;font-size:14.5px}
.gate span{font-size:12.5px;color:var(--muted)}
.gate .ck{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:var(--green);color:var(--lime);font-size:11px;font-weight:800;margin-right:6px;vertical-align:-3px}
/* signals */
.wtc{min-width:0}
.wl{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.wp{font-size:12px;color:var(--muted)}
.sig{display:grid;grid-template-columns:auto minmax(0,1fr) 230px 86px;gap:16px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.sig:last-child{border-bottom:0}
.sig.off .info,.sig.off .wt,.sig.off .cnt{opacity:.4}
.tog{width:42px;height:24px;border-radius:99px;background:rgba(0,31,0,.18);border:0;position:relative;flex:0 0 auto;padding:0}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.tog[aria-checked="true"]{background:var(--green)}
.tog[aria-checked="true"]::after{left:21px}
.info .nm{font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.info .rule{font-size:13px;color:var(--muted);margin-top:2px}
.info .src{font-size:11.5px;font-weight:600;color:var(--green);background:var(--tint);border-radius:6px;padding:1px 7px}
.info .edit{border:0;background:none;color:var(--muted);font-size:12.5px;font-weight:600;text-decoration:underline;padding:0}
.wt{display:flex;align-items:center;gap:10px}
.wt input{flex:1;accent-color:#024930;min-width:0}
.wt output{font-family:var(--display);font-size:22px;color:var(--green);width:30px;text-align:right;font-variant-numeric:tabular-nums}
.cnt{text-align:right;font-size:13px;color:var(--muted);line-height:1.2}
.cnt b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.addsig{width:100%;border:1.5px dashed rgba(2,73,48,.3);background:transparent;border-radius:14px;padding:14px;font-weight:700;color:var(--green);margin-top:10px}
/* ranking */
.rank{position:sticky;top:20px;padding:18px}
.rank h3{font-family:var(--display);font-size:28px;line-height:1;margin:0 0 4px;color:var(--green)}
.rank .s{font-size:13px;color:var(--muted);margin:0 0 14px}
.dist{display:flex;gap:2px;align-items:flex-end;height:54px;margin-bottom:6px}
.dist i{flex:1;background:var(--tint);border-radius:3px 3px 0 0;min-height:2px}
.dist i.hot{background:var(--green)}
.distl{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-bottom:12px}
.big{display:flex;gap:10px;margin-bottom:14px}
.big div{flex:1;background:var(--tint);border-radius:12px;padding:10px 12px}
.big b{display:block;font-family:var(--display);font-size:28px;line-height:1;color:var(--green);font-variant-numeric:tabular-nums}
.big span{font-size:12px;color:var(--muted)}
.ri{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left}
.ri .nm{font-weight:600;font-size:14px;line-height:1.2}
.ri .ln{font-size:12px;color:var(--muted)}
.score{flex:0 0 auto;width:42px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums;background:var(--tint);color:var(--green)}
.score.hot{background:var(--green);color:var(--lime)}
.score.warm{background:var(--lime);color:var(--green)}
.moved{font-size:11px;font-weight:700;width:26px;text-align:right}
.moved.up{color:var(--go)} .moved.dn{color:var(--stop)}
/* review */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:9px;padding:6px 12px;font-weight:600;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--lime)}
.cap{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:18px}
.capc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.capc .r{display:flex;justify-content:space-between;font-size:13.5px}
.capc .r b{font-variant-numeric:tabular-nums}
.capc .role{font-size:12px;color:var(--muted)}
.capbar{height:6px;background:var(--tint);border-radius:9px;margin-top:8px;overflow:hidden}
.capbar i{display:block;height:100%;background:var(--green)}
.capbar i.over{background:var(--warn)}
.row{display:grid;grid-template-columns:48px minmax(0,1.6fr) minmax(0,1.5fr) 96px;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.hdr{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding-block:10px}
.row.ok{background:rgba(230,255,169,.45)}
.row.no{opacity:.5}
.co{border:0;background:none;text-align:left;padding:0;min-width:0}
.co .nm{font-weight:700;display:block}
.co .ln{font-size:12.5px;color:var(--muted);display:block}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;font-weight:600;border-radius:7px;padding:2px 8px;background:var(--tint);color:var(--green);white-space:nowrap}
.chip.g{background:var(--green);color:var(--lime)}
select.own{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:7px 8px;background:var(--surface);font-size:13.5px}
.acts{display:flex;gap:6px;justify-content:flex-end}
.ic{width:40px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:16px;font-weight:800;color:var(--green)}
.ic.yes[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--lime)}
.ic.no[aria-pressed="true"]{background:var(--stop);border-color:var(--stop);color:#fff}
.reasons{grid-column:2/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.reasons button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:13px;font-weight:600}
.reasons button[aria-pressed="true"]{background:var(--stop);color:#fff;border-color:var(--stop)}
.sendbar{position:fixed;bottom:0;left:232px;right:0;background:var(--surface);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));z-index:30}
.sendbar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.tally{display:flex;gap:18px;font-size:14px;flex-wrap:wrap}
.tally b{font-family:var(--display);font-size:24px;margin-right:4px;font-variant-numeric:tabular-nums}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,31,0,.4);z-index:60;display:flex;justify-content:flex-end}
.drawer{width:min(520px,100%);height:100%;background:var(--bg);overflow-y:auto;padding:22px 24px calc(30px + env(safe-area-inset-bottom,0px));box-shadow:-20px 0 40px rgba(0,31,0,.15)}
.drawer .x{float:right;border:0;background:var(--tint);width:38px;height:38px;border-radius:10px;font-size:20px;color:var(--green)}
.drawer h2{font-family:var(--display);font-size:38px;line-height:.95;margin:8px 0 6px;color:var(--green)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.facts div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)}
.facts b{display:block;color:var(--ink);font-size:14.5px}
.bd{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.bdr{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:start}
.bdr:last-child{border-bottom:0}
.bdr .nm{font-weight:700;font-size:14px}
.bdr .ev{font-size:13px;color:var(--ink);margin-top:2px}
.bdr .so{font-size:11.5px;color:var(--muted);margin-top:3px}
.bdr .pts{font-family:var(--display);font-size:22px;color:var(--green);text-align:right}
.bdr.miss .nm,.bdr.miss .pts{color:var(--faint)}
.total{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--green);color:var(--lime);font-weight:700}
.total b{font-family:var(--display);font-size:28px}
.teaser{margin-top:16px;border:1.5px dashed rgba(2,73,48,.3);border-radius:14px;padding:14px;font-size:13.5px;color:var(--muted)}
.teaser b{color:var(--ink)}
/* builder */
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px;font-size:13px;font-weight:700}
.input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:15px;font-weight:400}
.cond{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.8fr) minmax(0,1fr) 36px;gap:8px;margin-top:8px}
.cond .input{padding:9px 10px;font-size:14px}
.cond button{border:0;background:var(--tint);border-radius:10px;color:var(--muted);font-size:18px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px}
.pill[aria-pressed="true"]{background:var(--green);color:var(--lime);border-color:var(--green)}
.preview{margin-top:16px;background:var(--lime);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--green);font-weight:600}
/* soon + done */
.soonpg{max-width:640px}
.soonpg ol{padding-left:20px;color:var(--ink)}
.soonpg li{margin-bottom:6px}
.done{max-width:620px;padding:26px}
.done h2{font-family:var(--display);font-size:40px;line-height:.95;color:var(--green);margin:0 0 8px}
.done ul{padding-left:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;z-index:90;max-width:calc(100% - 32px)}
.foot{margin-top:26px;font-size:12.5px;color:var(--faint)}
/* responsive */
/* contacts */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpis div{background:var(--surface);border:1px solid var(--line)}
.prio{display:flex;align-items:center;gap:18px;padding:14px 16px;flex-wrap:wrap}
.prio .grow{flex:1;min-width:200px}
.hint{font-size:13px;color:var(--muted)}
.order{display:flex;gap:8px;flex-wrap:wrap}
.op{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:5px 6px 5px 8px;font-weight:700;font-size:14px;background:var(--bg)}
.op .opn{width:20px;height:20px;border-radius:6px;background:var(--green);color:var(--lime);display:grid;place-items:center;font-size:11.5px}
.op button{border:0;background:var(--tint);border-radius:6px;width:24px;height:24px;color:var(--green);font-weight:800}
.op button[disabled]{opacity:.3}
.row2{display:flex;align-items:center;gap:10px}
.stepper{display:inline-flex;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:12px}
.stepper button{border:0;background:none;width:36px;height:36px;font-size:20px;color:var(--green);font-weight:700}
.stepper span{min-width:30px;text-align:center;font-family:var(--display);font-size:22px;color:var(--green)}
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;margin-top:18px;align-items:start}
.colist{max-height:calc(100vh - 140px);overflow-y:auto;position:sticky;top:20px}
.coi{display:flex;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:11px 14px}
.coi:last-child{border-bottom:0}
.coi[aria-current="true"]{background:var(--lime)}
.coi .nm{display:block;font-weight:700;font-size:14px;line-height:1.25}
.coi .ln{display:block;font-size:12px;color:var(--muted)}
.coi .grow{flex:1;min-width:0}
.cod{padding:20px}
.codh{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.codh .grow{flex:1;min-width:0}
.codh h2{font-family:var(--display);font-size:34px;line-height:.95;color:var(--green);margin:4px 0 6px}
.people{display:flex;flex-direction:column;gap:8px}
.person{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.person.prim{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.pa{width:38px;height:38px;border-radius:50%;background:var(--tint);color:var(--green);display:grid;place-items:center;font-weight:800;font-size:13px;flex:0 0 auto}
.pinfo{flex:1;min-width:0}
.pinfo .nm{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pinfo .ln{font-size:13px;color:var(--muted);margin-bottom:6px}
.dl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13.5px;margin-top:3px;min-width:0}
.dl .sel{user-select:all;overflow-wrap:anywhere}
.conf{font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px}
.conf.verified{background:#E3F5E6;color:var(--go)}
.conf.likely{background:#FFF0D4;color:var(--warn)}
.conf.guess{background:#FBE6E4;color:var(--stop)}
.so{font-size:12px;color:var(--muted)}
.pacts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.link.sm{font-size:13px}
.link.muted{color:var(--muted)}
.legal{margin-top:14px;background:var(--tint);border-radius:12px;padding:11px 13px;font-size:13px;color:var(--ink)}
/* playbooks */
.pbcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.pbc{position:relative;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.pbc[aria-current="true"]{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.pbc .pbn{position:absolute;top:12px;right:14px;font-size:12px;font-weight:700;color:var(--faint)}
.pbc .nm{font-family:var(--display);font-size:24px;line-height:1;color:var(--green);padding-right:20px}
.pbc .ln{font-size:13px;color:var(--muted)}
.pbs{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.pbs b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.asg{padding:14px 16px;margin-bottom:18px}
.asgh{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.asgh .grow{flex:1;min-width:220px}
.asgl{margin-top:12px;border-top:1px solid var(--line)}
.asgr{display:grid;grid-template-columns:44px minmax(0,1fr) 200px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.asgr:last-child{border-bottom:0}
@media (max-width:520px){.asgr{grid-template-columns:44px minmax(0,1fr)}.asgr select{grid-column:1/-1}}
.fs-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-6px 0 22px}
.fs-tabs button{border:0;background:none;padding:10px 14px;font-weight:700;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.fs-tabs button[aria-current="true"]{color:var(--green);border-bottom-color:var(--green)}
.fs-goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fs-goal{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.fs-gl{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fs-gv{display:flex;align-items:baseline;gap:8px}
.fs-gv b{font-family:var(--display);font-size:44px;line-height:1;color:var(--green);font-variant-numeric:tabular-nums}
.fs-gv span{color:var(--muted);font-size:15px}
.fs-gbar{position:relative;height:10px;background:var(--tint);border-radius:99px}
.fs-gbar i{display:block;height:100%;background:var(--green);border-radius:99px}
.fs-gbar em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.5;transform:translateX(-1px)}
.fs-gs{font-size:13.5px;font-weight:700}
.fs-gs.ok{color:var(--go)} .fs-gs.bad{color:var(--warn)}
.fs-three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
.fs-mini{padding:16px 18px}
.fs-mini h3,.fs-hc h3{font-family:var(--display);font-size:22px;line-height:1;color:var(--green);margin:0 0 12px}
.fs-kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.fs-kv:last-of-type{border-bottom:0}
.fs-kv b{font-variant-numeric:tabular-nums}
.fs-mini .hint{margin-top:8px}
.fs-rk{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:10px;font-size:14px}
.fs-rk .grow{flex:1;min-width:0}
.fs-rk.me{background:var(--lime);font-weight:700}
.fs-rn{width:22px;height:22px;border-radius:7px;background:var(--green);color:var(--lime);display:grid;place-items:center;font-size:12px;font-weight:800}
.fs-tours{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.fs-tour{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.fs-tour.nxt{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.fs-tdh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.fs-tdh b{font-family:var(--display);font-size:24px;color:var(--green);line-height:1}
.fs-tda{font-size:13.5px;color:var(--muted)}
.fs-tdn{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:4px}
.fs-tdn b{color:var(--ink);font-size:15px}
.fs-tour .fs-row{margin-top:4px}
.fs-tour .btn[disabled]{opacity:.45}
.fs-hc{padding:16px}
.fs-hc svg{display:block;width:100%;height:auto}
.fs-ed{width:min(600px,100%)}
.cal{padding:16px 18px}
.cal-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.cal-h .grow{flex:1;min-width:200px}
.cal-h b{font-family:var(--display);font-size:26px;color:var(--green);line-height:1;margin-right:10px}
.cal-sync{font-size:12px;font-weight:700;color:var(--go);white-space:nowrap}
.cal-sync::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--go);margin-right:5px}
.cal-grid{display:grid;gap:0 6px;overflow-x:auto}
.cal-grid.day{grid-template-columns:52px minmax(0,1fr)}
.cal-grid.week{grid-template-columns:52px repeat(5,minmax(120px,1fr))}
.cal-dh{border:0;background:none;font-weight:700;font-size:13px;color:var(--muted);padding:6px 4px;border-radius:8px;text-align:left}
.cal-dh.today{color:var(--lime);background:var(--green)}
.cal-times{position:relative}
.cal-times span{position:absolute;right:6px;transform:translateY(-6px);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.cal-col{position:relative;border-left:1px solid var(--line)}
.cal-col i{position:absolute;left:0;right:0;border-top:1px solid var(--line)}

function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
const NEXTMON=(()=>{const k=(8-TODAY.getDay())%7||7;return addDays(TODAY,k)})();

const gated=c=>!c.client&&!c.openDeal&&c.emp>=30&&SERVED.has(c.city);
function score(c){const act=S.signals.filter(s=>s.on&&s.w>0);const tot=act.reduce((a,s)=>a+s.w,0);if(!tot)return 0;
  return Math.round(100*act.filter(s=>c.s[s.id]).reduce((a,s)=>a+s.w,0)/tot)}
function pts(c,sig){const act=S.signals.filter(s=>s.on&&s.w>0);const tot=act.reduce((a,s)=>a+s.w,0);return tot&&sig.on?Math.round(100*sig.w/tot):0}
const tier=sc=>sc>=70?'hot':sc>=40?'warm':'';
function ranked(){return COS.filter(gated).map(c=>({c,sc:score(c)})).sort((a,b)=>b.sc-a.sc||b.c.emp-a.c.emp)}

/* ---------- 1. SIGNALS ---------- */
function vSignals(){
  const r=ranked();
  let h='<div class="head"><div><div class="eyebrow">Step 1 · Signals</div><h1>What makes a company worth calling</h1><p class="lead">Turn signals on or off and set the weight: how much each signal counts compared to the others. Every company gets a score from 0 to 100, the sum of the signals it matches. The ranking on the right updates as you go.</p></div><button class="btn light" data-act="resetw">Reset weights</button></div>';
  h+='<div class="cols"><div>';
  h+='<div class="sec"><div class="sech"><h2>Must have</h2><span>From the qualified-lead rules. Companies that fail are never scored.</span></div><div class="panel gates">'+
    [['30+ people on site','Office headcount, not total'],['A city we deliver to','Munich, Berlin, NRW'],['Not a client','Existing clients belong to E&R'],['No open deal','Nobody else owns it in HubSpot']].map(([a,b])=>'<div class="gate"><b><span class="ck">✓</span>'+a+'</b><span>'+b+'</span></div>').join('')+'</div></div>';
  CATS.forEach(([cat,title,sub])=>{
    const list=S.signals.filter(s=>s.cat===cat);
    h+='<div class="sec"><div class="sech"><h2>'+title+'</h2><span>'+sub+'</span></div><div class="panel">'+list.map(sigRow).join('')+(list.length?'':'<div style="padding:16px;color:var(--muted)">No custom signals yet.</div>')+'</div>'+(cat==='custom'?'<button class="addsig" data-act="newsig">+ Add a signal</button>':'')+'</div>';
  });
  h+='<p class="foot">Prototype: companies and evidence are invented sample data. In the live version signals come from Clay and refresh every night.</p></div>';
  h+='<div id="rank">'+rankPanel(r)+'</div></div>';
  return h;
}
function ptsLabel(s){return s.on?'Worth '+pts(null,s)+' of 100 points':'Off'}
function sigRow(s){
  const n=COS.filter(c=>gated(c)&&c.s[s.id]).length;
  return '<div class="sig'+(s.on?'':' off')+'"><button class="tog" role="switch" aria-checked="'+s.on+'" aria-label="'+esc(s.name)+'" data-act="tog" data-id="'+s.id+'"></button><div class="info"><div class="nm">'+esc(s.name)+'<span class="src">'+esc(s.src)+'</span></div><div class="rule">'+esc(s.rule)+' <button class="edit" data-act="editsig" data-id="'+s.id+'">Edit</button></div></div><div class="wtc"><div class="wl">Weight · how much it counts</div><div class="wt"><input type="range" min="0" max="30" step="1" value="'+s.w+'" id="w_'+s.id+'" data-w="'+s.id+'" aria-label="Weight of '+esc(s.name)+'" '+(s.on?'':'disabled')+'><output id="o_'+s.id+'">'+s.w+'</output></div><div class="wp" id="p_'+s.id+'">'+ptsLabel(s)+'</div></div><div class="cnt"><b>'+n+'</b>companies</div></div>';
}
function rankPanel(r){
  const hot=r.filter(x=>x.sc>=70).length,warm=r.filter(x=>x.sc>=40&&x.sc<70).length;
  const bins=Array(10).fill(0);r.forEach(x=>bins[Math.min(9,Math.floor(x.sc/10))]++);const mx=Math.max(...bins,1);
  const prev=S.baseline||{};
  let h='<div class="panel rank"><h3>Live ranking</h3><p class="s">'+r.length+' qualified companies scored with your weights</p>';
  h+='<div class="big"><div><b>'+hot+'</b><span>Hot · 70+</span></div><div><b>'+warm+'</b><span>Warm · 40–69</span></div></div>';
  h+='<div class="dist" aria-hidden="true">'+bins.map((b,i)=>'<i class="'+(i>=4?'hot':'')+'" style="height:'+Math.max(4,b/mx*100)+'%"></i>').join('')+'</div><div class="distl"><span>0</span><span>Score</span><span>100</span></div>';
  h+=r.slice(0,10).map((x,i)=>{const p=prev[x.c.id];const mv=p==null?'':p>i?'<span class="moved up">▲'+(p-i)+'</span>':p<i?'<span class="moved dn">▼'+(i-p)+'</span>':'<span class="moved"></span>';
    return '<button class="ri" data-act="open" data-id="'+x.c.id+'"><span class="score '+tier(x.sc)+'">'+x.sc+'</span><span style="flex:1;min-width:0"><span class="nm" style="display:block">'+esc(x.c.name)+'</span><span class="ln">'+esc(x.c.city)+' · '+x.c.emp+' people · '+esc(x.c.ind)+'</span></span>'+mv+'</button>'}).join('');
  h+='</div>';return h;
}
function snapshotRank(){const r=ranked();S.baseline={};r.slice(0,30).forEach((x,i)=>S.baseline[x.c.id]=i)}

/* ---------- 2. WEEKLY REVIEW ---------- */
function proposals(){
  return ranked().filter(x=>x.sc>=S.minScore&&(S.city==='All'||(S.city==='NRW'?['Düsseldorf','Köln','Dortmund'].includes(x.c.city):x.c.city===S.city)));
}
function ownerOf(c,i){return S.owners[c.id]||defaultOwner(c,i)}
function vReview(){
  const wk=isoWeek(NEXTMON);
  if(S.sent)return vSent();
  const list=proposals();
  let h='<div class="head"><div><div class="eyebrow">Step 2 · Approve companies · Week '+wk+', '+fmt(NEXTMON)+' – '+fmt(addDays(NEXTMON,4))+'</div><h1>Approve this week’s companies</h1><p class="lead">The best-scoring companies are proposed below. Approve the ones you want and reject the rest. Approved companies go to Contacts and then get a playbook, which decides who contacts them and when.</p></div><button class="btn light" data-act="approvetop">Approve top 20</button></div>';
  h+='<div class="toolbar"><span style="font-weight:600;font-size:14px">Minimum score</span><div class="seg">'+[30,40,50,60,70].map(v=>'<button data-act="min" data-v="'+v+'" aria-pressed="'+(S.minScore===v)+'">'+v+'+</button>').join('')+'</div><span style="font-weight:600;font-size:14px;margin-left:8px">City</span><div class="seg">'+['All','Munich','Berlin','NRW'].map(v=>'<button data-act="city" data-v="'+v+'" aria-pressed="'+(S.city===v)+'">'+v+'</button>').join('')+'</div></div>';
  h+='<div class="panel"><div class="row hdr"><span>Score</span><span>Company</span><span>Top signals</span><span style="text-align:right">Decision</span></div>';
  if(!list.length)h+='<div style="padding:24px;color:var(--muted)">No companies above this score. Lower the minimum score or change the weights in Signals.</div>';
  h+=list.map((x,i)=>{const c=x.c,d=S.decisions[c.id];const dd=typeof d==='object'?'no':d;
    const fired=S.signals.filter(s=>s.on&&c.s[s.id]).sort((a,b)=>b.w-a.w);
    return '<div class="row'+(dd==='ok'?' ok':dd==='no'?' no':'')+'"><span class="score '+tier(x.sc)+'">'+x.sc+'</span><button class="co" data-act="open" data-id="'+c.id+'"><span class="nm">'+esc(c.name)+'</span><span class="ln">'+esc(c.city)+' · '+c.emp+' people · '+esc(c.ind)+'</span></button><div class="chips">'+fired.slice(0,3).map((s,j)=>'<span class="chip'+(j===0?' g':'')+'">'+esc(s.name)+'</span>').join('')+(fired.length>3?'<span class="chip">+'+(fired.length-3)+'</span>':'')+'</div><div class="acts"><button class="ic yes" data-act="ok" data-id="'+c.id+'" aria-pressed="'+(dd==='ok')+'" aria-label="Approve">✓</button><button class="ic no" data-act="no" data-id="'+c.id+'" aria-pressed="'+(dd==='no')+'" aria-label="Reject">✕</button></div>'+
      (dd==='no'?'<div class="reasons"><span style="color:var(--muted)">Why?</span>'+['Not a fit','Already in talks','Too small on site','Bad timing','Other'].map(r=>'<button data-act="why" data-id="'+c.id+'" data-v="'+r+'" aria-pressed="'+(typeof d==='object'&&d.why===r)+'">'+r+'</button>').join('')+'</div>':'')+'</div>'}).join('');
  h+='</div>';
  return h;
}
function tallies(){const list=proposals();let ok=0,no=0;list.forEach(x=>{const d=S.decisions[x.c.id];if(d==='ok')ok++;else if(d)no++});return {ok,no,open:list.length-ok-no,list}}
function sendBar(){const t=tallies();

function ciActs(c,ctx,att){

const tMin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};

function calLanes(ev){let cl=[],end=-1;const flush=()=>{const lanes=[];cl.forEach(e=>{let i=lanes.findIndex(x=>x<=tMin(e.t));if(i<0){i=lanes.length;lanes.push(0)}lanes[i]=tMin(e.t)+e.dur;e.l=i});cl.forEach(e=>e.n=lanes.length);cl=[]};
  ev.forEach(e=>{const s=tMin(e.t);if(s>=end&&cl.length)flush();cl.push(e);end=Math.max(end,s+e.dur)});flush();return ev}

  const bd=c.closest('[data-board]');if(bd&&bd.dataset.board==='ae'){const id=fsDragId;fsDragId=null;aeDropStage(S.ae.deals.find(x=>x.id===id),c.dataset.drop);return}
  if(bd&&bd.dataset.board==='sd'){const k=S.sdr.who;const snap=sdSnap(k);const id=fsDragId;fsDragId=null;sdMove(k,id,c.dataset.drop);render();toast('Moved to '+sdTargetLbl(k,c.dataset.drop),sdUndo(k,snap));return}
  const k=S.fs.who;const snap=fsSnap(k);const id=fsDragId;fsDragId=null;fsMoveCo(k,id,c.dataset.drop);render();toast('Moved to '+fsTargetLbl(k,c.dataset.drop),fsUndo(k,snap))});
S=load()||fresh();
render();
})();
</script>
